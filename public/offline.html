<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline · Veltro</title>
    <meta name="theme-color" content="#F5F0E8" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light;
        --cream: #f5f0e8;
        --orange: #ea580c;
        --red: #dc2626;
        --ink: #0f172a;
        --muted: #64748b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1.5rem;
        background: var(--cream);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        background: rgba(220, 38, 38, 0.08);
        color: var(--red);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--red);
      }

      img {
        width: 72px;
        height: 72px;
      }

      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        max-width: 26rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.25rem;
      }

      button {
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        border-radius: 0.75rem;
        padding: 0.875rem 1.5rem;
        transition: transform 120ms ease, background-color 120ms ease;
      }

      button:active {
        transform: scale(0.97);
      }

      .primary {
        background: var(--orange);
        color: #0b0b0b;
      }

      .primary:hover {
        background: #c2410c;
      }

      .secondary {
        background: #fff;
        color: var(--ink);
        box-shadow: inset 0 0 0 1px #e2ded6;
      }

      .secondary:hover {
        background: #faf7f2;
      }

      .note {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <span class="badge"><span class="dot"></span> No connection</span>

    <img src="/icons/icon-192.png" alt="" width="72" height="72" />

    <h1>You're offline</h1>
    <p>
      Veltro needs a connection to show balances and move your money. Reconnect and
      we'll pick up right where you left off — nothing has been lost.
    </p>

    <div class="actions">
      <button class="primary" onclick="location.reload()">Try again</button>
      <button class="secondary" onclick="history.length > 1 ? history.back() : (location.href = '/home')">
        Go back
      </button>
    </div>

    <p class="note">For security, account data is never cached on your device.</p>

    <script>
      // When connectivity returns, retry automatically instead of making the
      // user tap "Try again" again.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
